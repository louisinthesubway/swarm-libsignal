name: "SWARM - node prebuilds and release"

# Builds the Node native library for win32-x64, linux-x64 and darwin-arm64 (optionally
# darwin-x64), packs the npm tarball and attaches everything to a GitHub Release.
#
# The organisation's Actions *artifact* storage is exhausted, so nothing here uses
# actions/upload-artifact: every output travels as a release asset instead.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update"
        required: true
        default: "swarm-libsignal-0.101.2-swarm.3"
      include_darwin_x64:
        description: "Also build darwin-x64 (Intel Macs; doubles the macOS runner time)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Used by every `gh` invocation below.
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    name: Prepare the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create the release if it does not exist
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it."
          else
            gh release create "$TAG" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "swarm-libsignal $TAG" \
              --notes "SWARM build of libsignal (upstream v0.101.2) with the SWARM network environment. See docs/SWARM-CHANGES.md and docs/HOW-DESKTOP-USES-IT.md. Assets are attached by the SWARM - node prebuilds and release workflow."
          fi

  build:
    name: Build ${{ matrix.label }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            platform: linux
            arch: x64
          - os: windows-latest
            label: win32-x64
            platform: win32
            arch: x64
          - os: macos-latest
            label: darwin-arm64
            platform: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "$(cat rust-toolchain)" --profile minimal

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: (Linux) Install protoc
        if: matrix.platform == 'linux'
        run: ./bin/install_protoc_linux

      - name: (Windows) Install nasm and protoc
        if: matrix.platform == 'win32'
        run: |
          choco install nasm --no-progress -y
          choco install protoc --no-progress -y
        shell: cmd

      - name: (macOS) Install protobuf
        if: matrix.platform == 'darwin'
        run: brew install protobuf

      - name: Build ${{ matrix.platform }}-${{ matrix.arch }}
        shell: bash
        working-directory: node
        run: npm run build -- --arch ${{ matrix.arch }} --copy-to-prebuilds

      - name: (macOS) Build darwin-x64 as well
        if: matrix.platform == 'darwin' && inputs.include_darwin_x64
        shell: bash
        working-directory: node
        run: |
          rustup target add x86_64-apple-darwin --toolchain "$(cat ../rust-toolchain)"
          npm run build -- --arch x64 --copy-to-prebuilds

      - name: Collect and hash the libraries
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          shopt -s nullglob
          for dir in node/prebuilds/*/; do
            name=$(basename "$dir")
            cp "$dir/@signalapp+libsignal-client.node" "upload/libsignal-client-$name.node"
          done
          cd upload
          ls -l
          if command -v sha256sum >/dev/null; then
            sha256sum ./*.node | tee "SHA256SUMS-${{ matrix.label }}.txt"
          else
            shasum -a 256 ./*.node | tee "SHA256SUMS-${{ matrix.label }}.txt"
          fi

      - name: Attach the libraries to the release
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" upload/* --clobber

  package:
    name: Pack the npm tarball
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Fetch the prebuilt libraries from the release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p incoming
          gh release download "$TAG" --pattern '*.node' --dir incoming --clobber
          ls -l incoming
          for path in incoming/libsignal-client-*.node; do
            name=$(basename "$path")
            name=${name#libsignal-client-}
            name=${name%.node}
            mkdir -p "node/prebuilds/$name"
            cp "$path" "node/prebuilds/$name/@signalapp+libsignal-client.node"
          done
          find node/prebuilds -type f -print

      - name: Fail if a required platform is missing
        run: |
          set -euo pipefail
          for required in win32-x64 linux-x64 darwin-arm64; do
            test -f "node/prebuilds/$required/@signalapp+libsignal-client.node" \
              || { echo "missing prebuild for $required"; exit 1; }
          done

      - run: npm ci
        working-directory: node

      - run: npm run tsc
        working-directory: node

      - name: Run the Node test suite against the linux-x64 prebuild
        working-directory: node
        env:
          PREBUILDS_ONLY: 1
        run: npm run test

      - name: npm pack
        id: pack
        working-directory: node
        run: |
          set -euo pipefail
          npm pack
          ls -l ./*.tgz
          echo "tarball=$(ls ./*.tgz)" >> "$GITHUB_OUTPUT"

      - name: Hash everything
        working-directory: node
        run: |
          set -euo pipefail
          sha256sum ./*.tgz prebuilds/*/*.node | tee SHA256SUMS.txt

      - name: Attach the tarball to the release
        working-directory: node
        env:
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" ./*.tgz SHA256SUMS.txt --clobber
